# The desktop releases, built on demand without publishing: the Linux AppImage
# and the Windows ZIP land as artifacts. This is the Nightly workflow's build
# half without the signing environment, for a fork that cannot sign upstream's
# releases. See docs/packaging.md.
name: Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      # The runner's preinstalled SDKs leave too little room for the build.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
        with:
          # Nix refuses a shallow Git repository as a flake.
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - name: Fetch the toolchain and crates
        run: nix develop path:./nix --command cargo fetch --locked
      - run: scripts/build-appimage
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: target/dist/linux/*
          if-no-files-found: error
          compression-level: 0

  windows:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      # The MSVC CRT and Windows SDK cargo-xwin downloads.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cargo-xwin
          key: windows-xwin-${{ hashFiles('nix/flake.lock') }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # Wine doesn't start on the runner (kernel32.dll, c0000135), so Inno
      # Setup can't make the installer there; the ZIP is the artifact.
      - run: nix develop path:./nix#windows --command scripts/build-windows discord --no-installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: target/dist/discord/*
          if-no-files-found: error
          compression-level: 0
