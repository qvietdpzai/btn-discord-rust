# The Android scaffold: cross-compiles the JNI library for three ABIs, then
# packs the shell into a debug APK. See docs/android.md.
name: Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "crates/yapfast-discord/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The bridge without an NDK: jni is pure Rust, so a host test catches
  # mistakes before the cross-compile spends its minutes.
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "android/rust -> target"
      - run: cargo test --locked --manifest-path android/rust/Cargo.toml

  native:
    needs: bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "android/rust -> target"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Build libbtn_android.so for every ABI
        run: |
          # The runner preinstalls the NDK; its variable differs by image.
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o android/app/src/main/jniLibs \
            --manifest-path android/rust/Cargo.toml \
            build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-native
          path: android/app/src/main/jniLibs
          if-no-files-found: error

  apk:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: android-native
          path: android/app/src/main/jniLibs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle -p android assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: btn-discord-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # Not part of the APK's job: the Discord protocol crate still needs its
  # desktop-only dependencies gated for Android (docs/android.md, step 1).
  # It reports how far that has got without failing the run.
  discord-protocol:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: aarch64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Try the Discord protocol crate for Android
        run: |
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}" >> "$GITHUB_ENV"
          cargo ndk -t arm64-v8a -o target/android \
            --manifest-path android/rust/Cargo.toml \
            build --release --features discord
